<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DeutschKarten</title>
<meta name="theme-color" content="#3B2A20">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeutschKarten">
<style>
  :root{
    --wood:#3B2A20; --wood-dark:#2A1D16;
    --card:#F3EAD3; --row:#EDE2C8; --line:#D9C9A8;
    --ink:#2B2620; --ink-soft:#6b6153;
    --red:#B5502D; --ochre:#C99A3B; --moss:#5B7B4F; --teal:#3E7C7A;
    --purple:#7f6bb0; --blue:#5f93b0; --lightred:#d9846f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
    background:var(--wood);
    color:var(--card);
    display:flex; flex-direction:column;
    height:100vh; overflow:hidden;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .serif{font-family:Georgia,serif;}
  .mono{font-family:'SF Mono','Courier New',monospace;}

  #topbar{
    padding:10px 14px 8px; display:flex; align-items:center; gap:8px; min-height:26px; flex:0 0 auto;
  }
  #topbar .backbtn{background:none;border:none;color:var(--card);font-size:22px;padding:0 4px 0 0;cursor:pointer;line-height:1;}
  #topbar .title{font-family:Georgia,serif;font-weight:700;font-size:19px;color:var(--card);flex:1;}
  #topbar .plusbtn{background:none;border:none;color:var(--card);font-size:22px;cursor:pointer;padding:0 4px;}

  #content{flex:1; overflow-y:auto; background:var(--card); -webkit-overflow-scrolling:touch;}

  .deck-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--row);cursor:pointer;}
  .deck-row .name{font-family:Georgia,serif;font-weight:700;font-size:17px;color:var(--ink);}
  .deck-row .sub{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .badge{font-family:'SF Mono',monospace;font-size:11px;padding:4px 9px;border-radius:10px;color:#fff;white-space:nowrap;}
  .badge.pend{background:var(--red);}
  .badge.nvo{background:var(--purple);}

  .sub-label{padding:10px 16px 4px;font-family:'SF Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}

  .hist{display:flex;align-items:flex-end;gap:6px;padding:16px 16px 6px;height:120px;}
  .hist .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .hist .bar{width:80%;border-radius:3px 3px 0 0;min-height:3px;}
  .hist .val{font-family:'SF Mono',monospace;font-size:9px;color:var(--ink);}
  .hist .lbl{font-family:'SF Mono',monospace;font-size:8px;color:var(--ink-soft);}

  .set-row{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--row);cursor:pointer;}
  .set-row i{font-size:17px;color:var(--teal);width:18px;text-align:center;}
  .set-row .lbl{flex:1;font-size:14px;color:var(--ink);}
  .set-row .val{font-size:12px;color:var(--ink-soft);}
  .set-row .chev{font-size:14px;color:var(--ink-soft);}

  .toggle{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s;}
  .toggle.on{background:var(--moss);}
  .toggle .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s;}
  .toggle.on .knob{left:21px;}

  .sticky-bottom{position:sticky;bottom:0;background:var(--row);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);}
  .sticky-bottom .go{display:flex;align-items:center;gap:6px;color:var(--teal);font-weight:700;font-size:15px;}
  .sticky-bottom .est{font-size:10px;color:var(--ink-soft);margin-top:1px;}
  .sticky-bottom .count{background:var(--moss);color:#fff;font-family:'SF Mono',monospace;font-size:13px;padding:6px 14px;border-radius:14px;}

  .metric-row{display:flex;gap:8px;padding:0 16px 10px;}
  .metric-card{background:var(--row);border-radius:8px;padding:10px 12px;flex:1;min-width:0;cursor:default;}
  .metric-card[data-goal-card]{cursor:pointer;}
  .metric-card .lbl{font-family:'SF Mono',monospace;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .metric-card .val{font-family:Georgia,serif;font-weight:700;font-size:17px;color:var(--ink);margin-top:2px;}

  .empty-msg{padding:60px 24px;text-align:center;color:var(--ink-soft);}
  .empty-msg .big{font-family:Georgia,serif;font-size:18px;color:var(--ink);margin-bottom:6px;}
  .empty-msg .small{font-size:12px;line-height:1.6;}

  .tj-search{display:flex;align-items:center;gap:8px;margin:10px 16px 0;padding:9px 12px;background:var(--row);border-radius:8px;}
  .tj-search i{color:var(--ink-soft);font-size:15px;}
  .tj-search input{flex:1;border:none;background:none;font-size:14px;color:var(--ink);outline:none;}
  .tj-search input::placeholder{color:var(--ink-soft);}
  .tj-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;gap:8px;}
  .tj-viewtoggle{display:flex;gap:4px;background:var(--row);border-radius:6px;padding:2px;}
  .tj-vbtn{border:none;background:none;padding:6px 10px;border-radius:5px;color:var(--ink-soft);cursor:pointer;}
  .tj-vbtn.active{background:var(--wood);color:var(--card);}
  .tj-chip{font-family:'SF Mono',monospace;font-size:11px;background:var(--red);color:#fff;padding:4px 8px;border-radius:10px;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap;}
  .tj-alpha{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;}
  .tj-letter{font-family:'SF Mono',monospace;font-size:12px;color:var(--ink-soft);background:var(--row);padding:4px 9px;border-radius:10px;cursor:pointer;flex:0 0 auto;}
  .tj-letter.active{background:var(--teal);color:#fff;}
  .tj-letter.tj-clear{background:var(--red);color:#fff;}
  .tj-list{padding-bottom:10px;}
  .tj-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--row);cursor:pointer;}
  .tj-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .tj-rowtext{flex:1;min-width:0;}
  .tj-german{font-family:Georgia,serif;font-weight:700;font-size:15px;color:var(--ink);}
  .tj-english{font-size:11px;color:var(--ink-soft);}
  .tj-emoji{font-size:15px;}
  .tj-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 16px 16px;}
  .tj-card{background:var(--row);border-radius:8px;overflow:hidden;cursor:pointer;}
  .tj-cardbadge{font-family:'SF Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em;color:#fff;text-align:center;padding:4px 0;}
  .tj-cardtop{padding:10px;}
  .tj-cardword{font-family:Georgia,serif;font-weight:700;font-size:15px;color:var(--ink);text-align:center;}
  .tj-carddivider{height:1px;background:var(--line);margin:8px 0;}
  .tj-cardenglish{font-size:12px;font-weight:700;color:var(--ink);text-align:center;}
  .tj-cardmeta{margin-top:8px;font-size:10px;color:var(--ink-soft);text-align:center;line-height:1.6;}

  #tabbar{display:flex;background:var(--wood);border-top:1px solid rgba(255,255,255,.1);flex:0 0 auto;}
  .tab-btn{flex:1;background:none;border:none;padding:8px 4px 10px;color:#c9a876;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .tab-btn.active{color:var(--card);}
  .tab-btn i{font-size:19px;}
  .tab-btn span{font-family:'SF Mono',monospace;font-size:9px;}

  #studyOverlay{position:fixed;inset:0;background:var(--wood);display:none;flex-direction:column;z-index:50;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
  #studyOverlay.show{display:flex;}
  .study-top{padding:12px 16px 6px;display:flex;align-items:center;justify-content:space-between;}
  .study-top .exitbtn{background:none;border:none;color:var(--card);font-size:22px;cursor:pointer;}
  .study-top .cnt{font-family:'SF Mono',monospace;font-size:12px;color:#c9a876;}
  .study-body{flex:1;padding:6px 20px;display:flex;align-items:center;justify-content:center;}
  .stage{perspective:1400px;width:100%;max-width:420px;height:300px;}
  .card-flip{position:relative;width:100%;height:100%;transition:transform .4s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer;}
  .card-flip.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:8px;
    box-shadow:0 10px 26px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:26px 22px;text-align:center;}
  .face::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:64px;height:13px;background:var(--red);border-radius:0 0 4px 4px;}
  .face .holes{position:absolute;left:9px;top:15px;bottom:15px;width:9px;display:flex;flex-direction:column;justify-content:space-evenly;}
  .face .holes span{width:7px;height:7px;border-radius:50%;background:var(--wood-dark);}
  .face.back{transform:rotateY(180deg);background:var(--row);}
  .wtype{font-family:'SF Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:8px;}
  .mainword{font-family:Georgia,serif;font-weight:700;color:var(--ink);line-height:1.25;}
  .art{font-weight:400;}
  .art-der{color:var(--blue);} .art-die{color:var(--red);} .art-das{color:var(--moss);}
  .topictag{margin-top:12px;font-family:'SF Mono',monospace;font-size:10px;color:var(--ink-soft);}
  .exsent{font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:12px;line-height:1.4;}
  .taphint{position:absolute;bottom:12px;font-family:'SF Mono',monospace;font-size:9px;color:var(--ink-soft);opacity:.6;text-transform:uppercase;}
  .ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 20px 18px;opacity:0;transform:translateY(8px);pointer-events:none;transition:all .2s ease;}
  .ratings.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .rate-btn{border:none;border-radius:6px;padding:13px 4px 9px;font-family:'SF Mono',monospace;font-size:11px;text-transform:uppercase;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;}
  .rate-btn .d{font-size:9px;opacity:.75;font-weight:400;}
  .rate-btn.again{background:var(--red);} .rate-btn.hard{background:var(--ochre);color:var(--ink);}
  .rate-btn.good{background:var(--moss);} .rate-btn.easy{background:var(--teal);}
  .session-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
  .session-done .big{font-family:Georgia,serif;font-size:20px;margin-bottom:8px;}
  .session-done button{margin-top:20px;background:var(--card);color:var(--ink);border:none;padding:10px 22px;border-radius:6px;font-size:13px;cursor:pointer;}

  #sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:60;}
  #sheetBg.show{display:block;}
  #sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;z-index:61;
    display:none;max-height:70vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);}
  #sheet.show{display:block;}
  .sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);}
  .sheet-hd .t{font-family:Georgia,serif;font-weight:700;color:var(--ink);font-size:15px;}
  .sheet-hd button{background:none;border:none;color:var(--teal);font-size:13px;font-weight:700;cursor:pointer;}
  .sheet-opt{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px;cursor:pointer;}
  .sheet-opt .chk{color:var(--teal);}

  #toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 70px);background:var(--wood-dark);color:var(--card);
    padding:10px 14px;border-radius:8px;font-size:12px;text-align:center;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;}
  #toast.show{opacity:1;}
</style>
</head>
<body>

<div id="topbar">
  <button class="backbtn" id="backBtn" style="display:none;"><i class="ti ti-chevron-left"></i></button>
  <div class="title" id="topTitle">Mazos</div>
  <button class="plusbtn" id="plusBtn" style="display:none;"><i class="ti ti-plus"></i></button>
</div>
<div id="content"></div>
<div id="tabbar">
  <button class="tab-btn active" data-tab="mazos"><i class="ti ti-cards"></i><span>Mazos</span></button>
  <button class="tab-btn" data-tab="stats"><i class="ti ti-chart-bar"></i><span>Estadísticas</span></button>
  <button class="tab-btn" data-tab="omni"><i class="ti ti-player-play"></i><span>OmniRepaso</span></button>
</div>

<div id="studyOverlay">
  <div class="study-top">
    <button class="exitbtn" id="exitStudy"><i class="ti ti-x"></i></button>
    <div class="cnt" id="studyCnt">0 / 0</div>
  </div>
  <div class="study-body" id="studyBody"></div>
  <div class="ratings" id="ratings">
    <button class="rate-btn again" data-g="1">Otra vez<span class="d" id="dAgain"></span></button>
    <button class="rate-btn hard" data-g="2">Difícil<span class="d" id="dHard"></span></button>
    <button class="rate-btn good" data-g="3">Bien<span class="d" id="dGood"></span></button>
    <button class="rate-btn easy" data-g="4">Fácil<span class="d" id="dEasy"></span></button>
  </div>
</div>

<div id="sheetBg"></div>
<div id="sheet">
  <div class="sheet-hd"><div class="t" id="sheetTitle"></div><button id="sheetDone">Hecho</button></div>
  <div id="sheetBody"></div>
</div>
<div id="toast"></div>

<script src="cards-data.js"></script>
<script>
const CUSTOM_KEY='dk_custom_cards_v1', PROGRESS_KEY='dk_progress_v2', SETTINGS_KEY='dk_settings_v1', LOG_KEY='dk_reviewlog_v1';
function loadJSON(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function saveJSON(k,v){ localStorage.setItem(k, JSON.stringify(v)); }

const DECKS=['A1','A2','B1.1','B1.2'];
const REGISTRY_KEY='dk_deck_registry_v1';
function getRegistry(){
  let r=loadJSON(REGISTRY_KEY,null);
  if(!r){ r=DECKS.map(id=>({id,name:id})); saveJSON(REGISTRY_KEY,r); }
  let changed=false;
  DECKS.forEach(id=>{ if(!r.find(d=>d.id===id)){ r.push({id,name:id}); changed=true; } });
  if(changed) saveJSON(REGISTRY_KEY,r);
  return r;
}
function saveRegistry(r){ saveJSON(REGISTRY_KEY,r); }
function allDeckIds(){ return getRegistry().map(d=>d.id); }
function deckName(id){ const d=getRegistry().find(x=>x.id===id); return d?d.name:id; }
function renameDeck(id,newName){ const r=getRegistry(); const d=r.find(x=>x.id===id); if(d && newName && newName.trim()){ d.name=newName.trim(); saveRegistry(r); } }
function addDeck(name){
  const r=getRegistry();
  let base=(name||'mazo').trim().replace(/\s+/g,'-')||'mazo', id=base, n=1;
  while(r.find(d=>d.id===id)){ id=base+'-'+(++n); }
  r.push({id, name:(name||id).trim()||id});
  saveRegistry(r);
  return id;
}
function allCards(){ return CARDS.concat(loadJSON(CUSTOM_KEY,[])); }
function cardsForLevel(lv){ return allCards().filter(c=>c.level===lv); }

const DEFAULT_SETTINGS={perSession:20,fontSize:26,autoFlip:0,reviewMode:'fsrs',retention:0.9,orientation:'normal',stabilizeOnFlip:true};
function getSettings(deckId){ const all=loadJSON(SETTINGS_KEY,{}); return Object.assign({},DEFAULT_SETTINGS, all[deckId]||{}); }
function setSetting(deckId,key,val){ const all=loadJSON(SETTINGS_KEY,{}); all[deckId]=Object.assign({},getSettings(deckId),{[key]:val}); saveJSON(SETTINGS_KEY,all); }

function getProgress(id){ const p=loadJSON(PROGRESS_KEY,{}); return p[id]||null; }
function setProgress(id,val){ const p=loadJSON(PROGRESS_KEY,{}); p[id]=val; saveJSON(PROGRESS_KEY,p); }

function logReview(cardId,level,grade,elapsedMs){
  const log=loadJSON(LOG_KEY,[]);
  log.push({ts:new Date().toISOString(),cardId,level,grade,elapsedMs:elapsedMs||0});
  if(log.length>20000) log.splice(0, log.length-20000);
  saveJSON(LOG_KEY,log);
}
function dayKey(d){ return d.toISOString().slice(0,10); }
function reviewsByDay(){
  const log=loadJSON(LOG_KEY,[]);
  const map={};
  log.forEach(e=>{ const k=dayKey(new Date(e.ts)); map[k]=(map[k]||0)+1; });
  return map;
}
function computeStreak(map){
  let streak=0; let cursor=new Date();
  if(!map[dayKey(cursor)]) cursor.setDate(cursor.getDate()-1);
  while(map[dayKey(cursor)]){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}
const DOW=['dom','lun','mar','mi\u00e9','jue','vie','s\u00e1b'];
function last7(){
  const map=reviewsByDay();
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    days.push({label: i===0?'Hoy':DOW[d.getDay()], val: map[dayKey(d)]||0});
  }
  return days;
}
function aggregateBuckets(){
  const buckets={nvo:0,ahora:0,'24h':0,manana:0,sem:0,futuro:0};
  allDeckIds().forEach(id=>{ cardsForLevel(id).forEach(c=>{ buckets[bucketFor(getProgress(c.id))]++; }); });
  return buckets;
}
function formatDuration(ms){
  const totalSec=Math.round(ms/1000);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  return (h?h+'h ':'')+(m?m+'m ':'')+s+'s';
}

const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const FF=19/81, CC=-0.5;
function retrievability(t,s){ return Math.pow(1+FF*(t/s), CC); }
function fsrsInterval(rd,s){ return (s/FF)*(Math.pow(rd,1/CC)-1); }
function clampD(d){ return Math.min(10,Math.max(1,d)); }
function s0(g){ return W[g-1]; }
function d0(g){ return clampD(W[4]-Math.exp(W[5]*(g-1))+1); }
function deltaD(g){ return -W[6]*(g-3); }
function difficultyNext(d,g){ const dp=d+deltaD(g)*((10-d)/9); return clampD(W[7]*d0(4)+(1-W[7])*dp); }
function sSuccess(d,s,r,g){
  const td=11-d, ts=Math.pow(s,-W[9]), tr=Math.exp(W[10]*(1-r))-1;
  const h=g===2?W[15]:1, b=g===4?W[16]:1, c=Math.exp(W[8]);
  return s*(1+td*ts*tr*h*b*c);
}
function sFail(d,s,r){
  const df=Math.pow(d,-W[12]), sf=Math.pow(s+1,W[13])-1, rf=Math.exp(W[14]*(1-r));
  return Math.min(W[11]*df*sf*rf, s);
}
function stabilityNext(d,s,r,g){ return g===1? sFail(d,s,r) : sSuccess(d,s,r,g); }

function computeNext(prog, grade, retention){
  const now=new Date();
  let s,d;
  if(!prog){ s=s0(grade); d=d0(grade); }
  else{
    const elapsed=Math.max(0,(now-new Date(prog.lastReview))/86400000);
    const r=retrievability(elapsed, prog.stability);
    s=stabilityNext(prog.difficulty, prog.stability, r, grade);
    d=difficultyNext(prog.difficulty, grade);
  }
  let due;
  if(grade===1){ due=new Date(now.getTime()+10*60000); }
  else { const days=Math.max(1,Math.round(fsrsInterval(retention,s))); due=new Date(now.getTime()+days*86400000); }
  return {stability:s, difficulty:d, due, reps:(prog?prog.reps:0)+1, lapses:(prog?prog.lapses:0)+(grade===1?1:0)};
}

function previewLabel(prog, retention, grade){
  const now=new Date();
  let s;
  if(!prog){ s=s0(grade); }
  else{
    const elapsed=Math.max(0,(now-new Date(prog.lastReview))/86400000);
    const r=retrievability(elapsed, prog.stability);
    s=stabilityNext(prog.difficulty, prog.stability, r, grade);
  }
  if(grade===1) return '10min';
  const days=Math.max(1,Math.round(fsrsInterval(retention,s)));
  if(days<30) return days+'d';
  if(days<365) return Math.round(days/30)+'m';
  return Math.round(days/365)+'a';
}

function bucketFor(prog){
  if(!prog) return 'nvo';
  const diffH=(new Date(prog.due)-new Date())/3600000;
  if(diffH<=0) return 'ahora';
  if(diffH<=24) return '24h';
  if(diffH<=48) return 'manana';
  if(diffH<=24*7) return 'sem';
  return 'futuro';
}

const TOPIC_EMOJI={'Alltag':'\ud83c\udfd9\ufe0f','Wetter':'\ud83c\udf26\ufe0f','Essen & Trinken':'\ud83c\udf7d\ufe0f',
  'Hobbys':'\ud83c\udfb8','Haus & Haushalt':'\ud83c\udfe0','Begr\u00fc\u00dfung':'\ud83d\udc4b',
  'Kleidung & Farben':'\ud83d\udc57','Familie':'\ud83d\udc6a','Frase':'\ud83d\udcac',
  'Berufe & Arbeit':'\ud83d\udcbc','Zeit & Datum':'\ud83d\udcc5','Otro':'\ud83d\udccc',
  'Kommunikation':'\ud83d\udcac','Wohnen':'\ud83c\udfe1','Gef\u00fchle':'\u2764\ufe0f',
  'Umwelt':'\ud83c\udf0d','Natur':'\ud83c\udf3f','Arbeit':'\ud83d\udcbc'};
const WORDTYPE_EMOJI={noun:'\ud83d\udce6',verb:'\u26a1',adjective:'\ud83c\udfa8',adverb:'\u27a1\ufe0f',preposition:'\ud83d\udd17',phrase:'\ud83d\udcac',other:'\ud83d\udccc'};
const WORDTYPE_LABEL={noun:'Substantiv',verb:'Verb',adjective:'Adjektiv',adverb:'Adverb',preposition:'Pr\u00e4position',phrase:'Redewendung',other:'Sonstiges'};
function topicEmoji(t){ return TOPIC_EMOJI[t] || '\ud83c\udff7\ufe0f'; }
function wordTypeEmoji(w){ return WORDTYPE_EMOJI[w] || '\ud83d\udccc'; }
function genderClass(g){ return g==='der'?'art-der':g==='die'?'art-die':g==='das'?'art-das':''; }
function genderDotColor(g){ return g==='der'?'var(--blue)':g==='die'?'var(--red)':g==='das'?'var(--moss)':'var(--ink-soft)'; }
function buildTagOptions(cards){
  const topics=[...new Set(cards.map(c=>c.topic).filter(Boolean))].map(t=>({key:'topic:'+t, label:topicEmoji(t)+' '+t}));
  const types=[...new Set(cards.map(c=>c.wordType).filter(Boolean))].map(w=>({key:'type:'+w, label:wordTypeEmoji(w)+' '+(WORDTYPE_LABEL[w]||w)}));
  return topics.concat(types);
}
function cardMatchesTagFilter(c, tagFilter){
  if(!tagFilter || !tagFilter.length) return true;
  return tagFilter.some(t=>{
    if(t.indexOf('topic:')===0) return c.topic===t.slice(6);
    if(t.indexOf('type:')===0) return c.wordType===t.slice(5);
    return false;
  });
}

function parseCSV(text, delim){
  delim = delim || ',';
  const rows=[]; let row=[]; let field=''; let q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else{
      if(c==='"') q=true;
      else if(c===delim){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c!=='\r') field+=c;
    }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function detectDelimiter(text){
  const firstLine=(text.split(/\r?\n/)[0]||'');
  const counts={',':(firstLine.match(/,/g)||[]).length, ';':(firstLine.match(/;/g)||[]).length, '\t':(firstLine.match(/\t/g)||[]).length};
  let best=',', bestN=counts[','];
  if(counts[';']>bestN){best=';'; bestN=counts[';'];}
  if(counts['\t']>bestN){best='\t'; bestN=counts['\t'];}
  return best;
}
const HEADER_ALIASES={german:'german',deutsch:'german',wort:'german',
  english:'english',ingles:'english',englisch:'english',
  wordtype:'wordType',tipo:'wordType',tipodepalabra:'wordType',
  topic:'topic',tema:'topic',categoria:'topic',
  gender:'gender',articulo:'gender',genero:'gender',
  plural:'plural',pp:'pp',partizip:'pp',
  auxiliaryverb:'auxiliaryVerb',verboauxiliar:'auxiliaryVerb',
  separable:'separable',separableprefix:'separablePrefix',prefijoseparable:'separablePrefix',
  presentconj:'presentConj',praesens:'presentConj',
  praeteritum:'praeteritum',preterito:'praeteritum',
  verbcase:'verbCase',casoverbal:'verbCase',
  example:'example',ejemplo:'example',beispiel:'example',
  notes:'notes',notas:'notes',
  komparativ:'komparativ',superlativ:'superlativ',
  conjtype:'conjType',tipodeconjugacion:'conjType',
  prepcase:'prepCase',casopreposicion:'prepCase',
  level:'level',nivel:'level'};
function normHeader(h){
  const k=h.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
  return HEADER_ALIASES[k]||null;
}
function normalizeLevel(v){
  if(!v) return null;
  const k=v.trim().toLowerCase().replace(/[\s._-]+/g,'');
  const reg=getRegistry();
  const byId=reg.find(d=>d.id.toLowerCase().replace(/[\s._-]/g,'')===k);
  if(byId) return byId.id;
  const byName=reg.find(d=>d.name.toLowerCase().replace(/[\s._-]/g,'')===k);
  if(byName) return byName.id;
  return null;
}
function normalizeGermanField(str){
  let s=(str||'').trim();
  const m=s.match(/^(der|die|das)\s+/i);
  let gender=null;
  if(m){ gender=m[1].toLowerCase(); s=s.slice(m[0].length); }
  return {german:s, gender};
}
function parseAndGroupCSV(text, forceLevel){
  const delim=detectDelimiter(text);
  const rows=parseCSV(text, delim).filter(r=>r.some(c=>c.trim()!==''));
  if(!rows.length) return {groups:[], invalidRows:0};
  const headers=rows[0].map(normHeader);
  const groups={};
  let invalidRows=0;
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const obj={};
    headers.forEach((h,idx)=>{ if(h) obj[h]=(r[idx]||'').trim(); });
    if(!obj.german){ invalidRows++; continue; }
    let levelId=null, rawLevel=null;
    if(forceLevel){ levelId=forceLevel; }
    else{ rawLevel=obj.level; levelId=normalizeLevel(rawLevel); }
    const key=levelId?('ID:'+levelId):('RAW:'+(rawLevel||'(sin nivel)'));
    if(!groups[key]) groups[key]={levelId, rawLevel, rows:[]};
    groups[key].rows.push(obj);
  }
  return {groups:Object.values(groups), invalidRows};
}
function insertRows(rows, levelId){
  const custom=loadJSON(CUSTOM_KEY,[]);
  const existing=allCards();
  let added=0, skipped=0;
  rows.forEach((obj,i)=>{
    const norm=normalizeGermanField(obj.german);
    const gender=obj.gender||norm.gender||null;
    const dup=existing.concat(custom).some(c=>c.level===levelId && c.german.trim().toLowerCase()===norm.german.toLowerCase());
    if(dup){ skipped++; return; }
    const card=Object.assign({}, obj);
    card.id='custom-'+levelId+'-'+Date.now()+'-'+i+'-'+Math.floor(Math.random()*10000);
    card.level=levelId; card.german=norm.german; card.gender=gender;
    if(!card.wordType) card.wordType='other';
    custom.push(card);
    added++;
  });
  saveJSON(CUSTOM_KEY, custom);
  return {added, skipped};
}
function runImportFlow(text, forceLevel){
  const {groups, invalidRows}=parseAndGroupCSV(text, forceLevel);
  let totalAdded=0, totalSkipped=0, totalInvalid=invalidRows;
  const matched=groups.filter(g=>g.levelId);
  const unmatched=groups.filter(g=>!g.levelId);
  matched.forEach(g=>{ const res=insertRows(g.rows, g.levelId); totalAdded+=res.added; totalSkipped+=res.skipped; });

  function finishImport(){
    let msg='Importadas '+totalAdded+' \u00b7 Duplicadas '+totalSkipped+' \u00b7 Inv\u00e1lidas '+totalInvalid;
    if(totalInvalid>0) msg+=' (revisa la columna "german")';
    showToast(msg);
    if(state.screen==='deck') renderDeck(state.deckId);
    else renderMazos();
  }
  function processUnmatched(idx){
    if(idx>=unmatched.length){ finishImport(); return; }
    const g=unmatched[idx];
    openTextPrompt('Mazo nuevo', 'Nombre del mazo', g.rawLevel||'Mazo nuevo', (name)=>{
      if(name){
        const id=addDeck(name);
        const res=insertRows(g.rows, id);
        totalAdded+=res.added; totalSkipped+=res.skipped;
      } else { totalInvalid+=g.rows.length; }
      processUnmatched(idx+1);
    }, 'El CSV incluye tarjetas de un nivel "'+(g.rawLevel||'(sin especificar)')+'" que no existe todav\u00eda. \u00bfC\u00f3mo quieres llamar a este mazo? Podr\u00e1s cambiarle el nombre despu\u00e9s.');
  }
  if(unmatched.length) processUnmatched(0); else finishImport();
}
function openTextPrompt(title, placeholder, defaultValue, onConfirm, desc){
  let html='<div style="padding:4px 16px 20px;">';
  if(desc) html+='<div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;line-height:1.5;">'+desc+'</div>';
  html+='<input type="text" id="promptInput" value="'+String(defaultValue||'').replace(/"/g,'&quot;')+'" placeholder="'+placeholder+'" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px;color:var(--ink);box-sizing:border-box;">'+
    '<button id="promptConfirm" style="margin-top:14px;width:100%;padding:12px;border:none;border-radius:8px;background:var(--teal);color:#fff;font-size:14px;font-weight:700;cursor:pointer;">Guardar</button>'+
    '</div>';
  openSheet(title, html);
  const inputEl=document.getElementById('promptInput');
  document.getElementById('promptConfirm').onclick=()=>{
    const val=inputEl.value.trim();
    closeSheet();
    onConfirm(val);
  };
}
function triggerImport(forceLevel){
  const input=document.createElement('input');
  input.type='file'; input.accept='.csv,text/csv';
  input.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{ runImportFlow(ev.target.result, forceLevel); };
    reader.readAsText(file);
  };
  input.click();
}

function cardMetaParts(c){
  const parts=[];
  if(c.wordType==='verb'){
    if(c.separable && c.separable!=='false' && c.separable!=='no' && c.separable!=='0') parts.push(['Trennbar'+(c.separablePrefix?' ('+c.separablePrefix+'-)':''), null]);
    if(c.verbCase) parts.push(['Kasus: '+c.verbCase, caseColor(c.verbCase)]);
    if(c.pp) parts.push(['PP: '+(c.auxiliaryVerb?c.auxiliaryVerb+' ':'')+c.pp, null]);
  } else if(c.wordType==='noun'){
    if(c.plural) parts.push(['Plural: '+c.plural, null]);
  } else if(c.wordType==='preposition'){
    if(c.prepCase) parts.push(['Kasus: '+c.prepCase, caseColor(c.prepCase)]);
  } else if(c.wordType==='adjective'){
    if(c.komparativ) parts.push([c.komparativ+(c.superlativ?' / '+c.superlativ:''), null]);
  }
  return parts;
}
function caseColor(v){
  const k=(v||'').toLowerCase();
  if(k.indexOf('akkusativ')>=0) return 'var(--red)';
  if(k.indexOf('dativ')>=0) return 'var(--moss)';
  if(k.indexOf('genitiv')>=0) return 'var(--purple)';
  if(k.indexOf('nominativ')>=0) return 'var(--blue)';
  return 'var(--ink-soft)';
}

  };

  content.querySelectorAll('.tj-letter[data-wt]').forEach(el=>el.onclick=()=>{

  });

function renderTarjetasResults(deckId){
  const allInDeck=cardsForLevel(deckId);
  let cards=allInDeck;
  if(tarjetasBucket) cards=cards.filter(c=>bucketFor(getProgress(c.id))===tarjetasBucket);
  if(tarjetasWordType) cards=cards.filter(c=>c.wordType===tarjetasWordType);
  if(tarjetasSearch.trim()){
    const q=tarjetasSearch.trim().toLowerCase();
    cards=cards.filter(c=>(c.german||'').toLowerCase().indexOf(q)>=0 || (c.english||'').toLowerCase().indexOf(q)>=0);
  }
  cards=sortCards(cards, tarjetasSort);

  let h='';
  if(!cards.length){
    h='<div class="empty-msg"><div class="big">Sin tarjetas</div><div class="small">No hay tarjetas con este filtro.</div></div>';
  } else if(tarjetasView==='list'){
    h='<div class="tj-list">'+cards.map(tjListRow).join('')+'</div>';
  } else {
    h='<div class="tj-grid">'+cards.map(tjGridCard).join('')+'</div>';
  }
  const results=document.getElementById('tjResults');
  results.innerHTML=h;
  results.querySelectorAll('[data-card-id]').forEach(el=>el.onclick=()=>openCardDetail(el.dataset.cardId));
}

function tjGridCard(c){

const PRONOUNS=['ich','du','er/sie/es','wir','ihr','sie/Sie'];
function parseConjArray(v){
  if(!v) return null;

}
function conjTableHTML(title, arr){

function openCardDetail(cardId){

function openMultiPicker(title, options, selected, onDone){
  let sel=selected.slice();

    el.onclick=()=>{
      const v=el.dataset.v; const i=sel.indexOf(v);

/* ---------- Estadisticas ---------- */
function sectionLabel(t){ return '<div class="sub-label">'+t+'</div>'; }
function metricRow(pairs){
  return '<div class="metric-row">'+pairs.map(p=>{
    const isGoal=p[0]==='Objetivo diario';
    return '<div class="metric-card"'+(isGoal?' data-goal-card':'')+'><div class="lbl">'+p[0]+'</div><div class="val">'+p[1]+'</div></div>';
  }).join('')+'</div>';
}
function barChart(items){
  const mx=Math.max(1,...items.map(x=>x[1]));
  return '<div class="hist">'+items.map(x=>{
    const hpx=Math.max(3,Math.round((x[1]/mx)*80));
    return '<div class="bar-wrap"><span class="val">'+x[1]+'</span><div class="bar" style="height:'+hpx+'px;background:var('+x[2]+');"></div><span class="lbl">'+x[0]+'</span></div>';
  }).join('')+'</div>';
}
function renderStats(){
  state.screen='stats'; state.deckId=null;
  topTitle.textContent='Estad\u00edsticas'; backBtn.style.display='none'; plusBtn.style.display='none';
  const log=loadJSON(LOG_KEY,[]);
  const map=reviewsByDay();
  const goal=loadJSON('dk_goal_v1',50);
  const todayCount=map[dayKey(new Date())]||0;
  const last7d=last7();
  const sum7=last7d.reduce((a,b)=>a+b.val,0);
  let sum30=0; for(let i=0;i<30;i++){ const d=new Date(); d.setDate(d.getDate()-i); sum30+=map[dayKey(d)]||0; }
  const avgPerDay=Math.round(sum30/30);
  const streak=computeStreak(map);
  let daysWithGoal30=0; for(let i=0;i<30;i++){ const d=new Date(); d.setDate(d.getDate()-i); if((map[dayKey(d)]||0)>=goal) daysWithGoal30++; }
  const activeDays=Object.keys(map).length;
  let bestDay=null,bestVal=0;
  Object.keys(map).forEach(k=>{ if(map[k]>bestVal){bestVal=map[k]; bestDay=k;} });

  const allCardsArr=allCards();
  const matureCount=allCardsArr.filter(c=>{ const p=getProgress(c.id); return p && p.stability>=21; }).length;
  const newCount=allCardsArr.filter(c=>!getProgress(c.id)).length;

  let totalTime=0, gradeCounts=[0,0,0,0];
  log.forEach(e=>{ totalTime+=(e.elapsedMs||0); gradeCounts[e.grade-1]++; });
  const totalReviews=log.length;
  const hitRate=totalReviews? Math.round(100*(totalReviews-gradeCounts[0])/totalReviews):0;
  const avgTime=totalReviews? Math.round(totalTime/totalReviews/1000):0;

  const buckets=aggregateBuckets();
  const bOrder=[['Nvo',buckets.nvo,'--purple'],['Ahora',buckets.ahora,'--red'],['<24h',buckets['24h'],'--lightred'],['Ma\u00f1ana',buckets.manana,'--ochre'],['<1sem',buckets.sem,'--blue'],['Futuro',buckets.futuro,'--moss']];

  let h='';
  h+=sectionLabel('Progreso diario');
  h+=metricRow([['Repasos de hoy', todayCount+'/'+goal],['Prom. por d\u00eda', avgPerDay]]);
  h+=metricRow([['\u00daltimos 7 d\u00edas', sum7],['\u00daltimos 30 d\u00edas', sum30]]);
  h+=barChart(last7d.map(x=>[x.label,x.val,'--blue']));

  h+=sectionLabel('Ritmo de estudio');
  h+=metricRow([['Objetivo diario', goal],['Racha (d\u00edas)', streak]]);
  h+=metricRow([['D\u00edas con objetivo (30d)', daysWithGoal30+'/30'],['D\u00edas activos', activeDays]]);
  h+=metricRow([['Mejor d\u00eda', bestDay? bestDay+' \u00b7 '+bestVal : '\u2014']]);

  h+=sectionLabel('Biblioteca');
  h+=metricRow([['Mazos', allDeckIds().length],['Tarjetas', allCardsArr.length]]);
  h+=metricRow([['Nuevas', newCount],['Maduras (>21d)', matureCount]]);

  h+=sectionLabel('Calidad de respuesta');
  h+=metricRow([['Tasa de aciertos', hitRate+'%'],['Repasos totales', totalReviews]]);
  h+=metricRow([['Tiempo total', formatDuration(totalTime)],['Tiempo prom.', avgTime+'s']]);
  h+=barChart([['Falla',gradeCounts[0],'--red'],['Dif\u00edcil',gradeCounts[1],'--ochre'],['Bien',gradeCounts[2],'--teal'],['F\u00e1cil',gradeCounts[3],'--moss']]);

  h+=sectionLabel('Tarjetas pendientes');
  h+=metricRow([['Pendientes ahora', buckets.ahora],['Nuevo', buckets.nvo]]);
  h+=barChart(bOrder);
  h+='<div style="height:14px;"></div>';

  content.innerHTML=h;
  const goalCard=content.querySelector('[data-goal-card]');
  if(goalCard) goalCard.onclick=()=>{
    openPicker('Objetivo diario de estudio', [20,50,100,150,200,300].map(v=>({label:String(v),value:String(v)})), String(goal), v=>{ saveJSON('dk_goal_v1', parseInt(v)); renderStats(); });
  };
}

/* ---------- OmniRepaso ---------- */
const OMNI_META_KEY='dk_omni_meta_v1';
function getOmniMeta(){ return Object.assign({period:'all', decks:allDeckIds()}, loadJSON(OMNI_META_KEY,{})); }
function setOmniMeta(m){ saveJSON(OMNI_META_KEY, m); }
function lastStudiedDate(deckId){
  const log=loadJSON(LOG_KEY,[]);
  let max=null;
  log.forEach(e=>{ if(e.level===deckId){ const d=new Date(e.ts); if(!max||d>max) max=d; } });
  return max;
}
function decksForPeriod(period){
  if(period==='all') return allDeckIds();
  const now=new Date(); const days= period==='week'?7:period==='month'?30:90;
  const cutoff=new Date(now.getTime()-days*86400000);
  return allDeckIds().filter(id=>{ const d=lastStudiedDate(id); return d && d>=cutoff; });
}
function buildOmniPool(meta, s){
  let pool=[];
  meta.decks.forEach(id=>{
    cardsForLevel(id).forEach(c=>{
      const b=bucketFor(getProgress(c.id));
      if((b==='ahora'||b==='nvo') && cardMatchesTagFilter(c, s.tagFilter)) pool.push(c);
    });
  });
  return pool;
}
function renderOmni(){
  state.screen='omni'; state.deckId=null;
  topTitle.textContent='OmniRepaso'; backBtn.style.display='none'; plusBtn.style.display='none';
  let meta=getOmniMeta();
  const avail=decksForPeriod(meta.period);
  meta.decks=meta.decks.filter(d=>avail.indexOf(d)>=0);
  if(!meta.decks.length) meta.decks=avail.slice();
  setOmniMeta(meta);

  const s=getSettings('omni');
  const pool=buildOmniPool(meta,s);
  const omniCards=meta.decks.flatMap(id=>cardsForLevel(id));
  const tagOptions=buildTagOptions(omniCards);
  const selTopics=s.tagFilter&&s.tagFilter.length?s.tagFilter:[];

  h+=setRow('cards','Mazos', meta.decks.length+'/'+allDeckIds().length);

  h+=setRow('copy','Tarjetas por sesi\u00f3n', s.perSession==='all'?'Todo':s.perSession);

  h+=setRow('shuffle','Modo de repaso', {fsrs:'FSRS',clasico:'Cl\u00e1sico',aleatorio:'Aleatorio',creacion:'En orden de creaci\u00f3n'}[s.reviewMode]);
  h+=setRow('brain','Retenci\u00f3n FSRS', {0.85:'Ligero 85%',0.9:'Equilibrado 90%',0.95:'Intensivo 95%'}[s.retention]);
  h+=setRow('refresh','Orientaci\u00f3n de la tarjeta', {normal:'Normal',invertido:'Invertido',mixto:'Mixto'}[s.orientation]);
  h+='<div class="set-row" id="omniStabRow"><i class="ti ti-arrow-bar-to-down"></i><span class="lbl">Estabilizaci\u00f3n al voltear</span><div class="toggle '+(s.stabilizeOnFlip?'on':'')+'" id="omniStabToggle"><div class="knob"></div></div></div>';
  h+='<div class="sticky-bottom"><div><div class="go"><i class="ti ti-player-play"></i>Repasar</div><div class="est">Tiempo estimado '+estMinutes(pool.length)+' min</div></div><span class="count">'+pool.length+'</span></div>';

  content.innerHTML=h;
  document.querySelectorAll('.set-row').forEach(el=>{
    el.onclick=()=>{
      const label=el.dataset.label;
      if(label==='Per\u00edodo') openPicker('Per\u00edodo',[['week','Semana pasada'],['month','Mes pasado'],['3months','\u00daltimos 3 meses'],['all','Todo']].map(v=>({label:v[1],value:v[0]})), meta.period, v=>{ meta.period=v; setOmniMeta(meta); renderOmni(); });
      else if(label==='Mazos') openMultiPicker('Mazos', avail.map(id=>({key:id,label:deckName(id)})), meta.decks, sel=>{ meta.decks=sel.length?sel:avail.slice(); setOmniMeta(meta); renderOmni(); });
      else if(label==='Etiquetas') openMultiPicker('Etiquetas', tagOptions, selTopics, sel=>{ setSetting('omni','tagFilter',sel); renderOmni(); });
      else if(label==='Tarjetas por sesi\u00f3n') openPicker('Tarjetas por sesi\u00f3n',[10,20,30,50,100,'all'].map(v=>({label:v==='all'?'Todo':String(v),value:String(v)})), String(s.perSession), v=>{setSetting('omni','perSession', v==='all'?'all':parseInt(v)); renderOmni();});
      else if(label==='Tama\u00f1o de fuente') openPicker('Tama\u00f1o de fuente',[18,20,22,24,26,28,32].map(v=>({label:v+'px',value:String(v)})), String(s.fontSize), v=>{setSetting('omni','fontSize',parseInt(v)); renderOmni();});
      else if(label==='Temporizador de volteo autom\u00e1tico') openPicker('Temporizador de volteo autom\u00e1tico',[0,5,10,15,20].map(v=>({label:v?v+'s':'Apagado',value:String(v)})), String(s.autoFlip), v=>{setSetting('omni','autoFlip',parseInt(v)); renderOmni();});
      else if(label==='Modo de repaso') openPicker('Modo de repaso',[['fsrs','FSRS'],['clasico','Cl\u00e1sico'],['aleatorio','Aleatorio'],['creacion','En orden de creaci\u00f3n']].map(v=>({label:v[1],value:v[0]})), s.reviewMode, v=>{setSetting('omni','reviewMode',v); renderOmni();});

  document.getElementById('omniStabToggle').onclick=(e)=>{ e.stopPropagation(); setSetting('omni','stabilizeOnFlip', !s.stabilizeOnFlip); renderOmni(); };
  content.querySelector('.sticky-bottom').onclick=()=>{
    const finalPool=buildOmniPool(meta,s);
    startStudySession(finalPool, s, {type:'omni'});
  };
}

let studyQueue=[], studyIdx=0, studyReturn=null, studySettings=null, flipped=false, autoFlipTimer=null, studyDone=0, cardShownAt=0;

function startStudy(deckId, forcedBucket){
  const cards=cardsForLevel(deckId);
  const s=getSettings(deckId);
  const pool=cards.filter(c=>{
    const b=bucketFor(getProgress(c.id));
    const dueOk = forcedBucket ? (b===forcedBucket) : (b==='ahora'||b==='nvo');
    if(!dueOk) return false;
    return cardMatchesTagFilter(c, s.tagFilter);
  });
  startStudySession(pool, s, {type:'deck', id:deckId});
}

function startStudySession(pool, s, returnTo){
  studySettings=s; studyReturn=returnTo; studyDone=0;
  if(s.reviewMode==='aleatorio') pool.sort(()=>Math.random()-0.5);
  else if(s.reviewMode==='creacion') pool.sort((a,b)=>a.id.localeCompare(b.id));
  else pool.sort((a,b)=>{
    const pa=getProgress(a.id), pb=getProgress(b.id);
    const da=pa?new Date(pa.due):new Date(0), db=pb?new Date(pb.due):new Date(0);
    return da-db;
  });
  if(s.perSession!=='all') pool=pool.slice(0, s.perSession);
  studyQueue=pool; studyIdx=0;
  document.getElementById('studyOverlay').classList.add('show');
  renderStudyCard();
}
document.getElementById('exitStudy').onclick=()=>{
  clearTimeout(autoFlipTimer);
  document.getElementById('studyOverlay').classList.remove('show');
  if(studyReturn){
    if(studyReturn.type==='deck') renderDeck(studyReturn.id);
    else if(studyReturn.type==='omni') renderOmni();
  }
};

function renderStudyCard(){
  clearTimeout(autoFlipTimer);
  document.getElementById('studyCnt').textContent=(studyIdx)+' / '+studyQueue.length;
  const body=document.getElementById('studyBody');
  if(studyIdx>=studyQueue.length){
    body.innerHTML='<div class="session-done"><div class="big">Sesi\u00f3n completa</div><div style="font-size:12px;color:#c9a876;">Hiciste '+studyDone+' tarjetas.</div></div>';
    document.getElementById('ratings').classList.remove('show');
    return;
  }
  const c=studyQueue[studyIdx];
  let orient=studySettings.orientation;
  if(orient==='mixto') orient=Math.random()<0.5?'normal':'invertido';
  const showGermanFirst = orient!=='invertido';
  const article=c.gender==='der'?'der ':c.gender==='die'?'die ':c.gender==='das'?'das ':'';
  const artCls=genderClass(c.gender);
  const fz=studySettings.fontSize;
  const typeLbl=(WORDTYPE_LABEL[c.wordType]||(c.wordType||'').toUpperCase());
  const frontHTML = showGermanFirst
    ? '<div class="wtype">'+wordTypeEmoji(c.wordType)+' '+typeLbl+'</div><div class="mainword" style="font-size:'+fz+'px;">'+(article?'<span class="art '+artCls+'">'+article+'</span>':'')+c.german+'</div><div class="topictag">'+(c.topic?topicEmoji(c.topic)+' '+c.topic:'')+'</div>'
    : '<div class="mainword" style="font-size:'+fz+'px;">'+c.english+'</div>';
  const backHTML = showGermanFirst
    ? '<div class="mainword" style="font-size:'+Math.round(fz*0.85)+'px;">'+c.english+'</div><div class="exsent">'+(c.example||'')+'</div>'
    : '<div class="wtype">'+wordTypeEmoji(c.wordType)+' '+typeLbl+'</div><div class="mainword" style="font-size:'+Math.round(fz*0.85)+'px;">'+(article?'<span class="art '+artCls+'">'+article+'</span>':'')+c.german+'</div><div class="exsent">'+(c.example||'')+'</div>';

  body.innerHTML='<div class="stage"><div class="card-flip" id="cardFlip">'+
    '<div class="face front"><div class="holes"><span></span><span></span><span></span><span></span><span></span></div>'+frontHTML+'<div class="taphint">Toca para voltear</div></div>'+
    '<div class="face back"><div class="holes"><span></span><span></span><span></span><span></span><span></span></div>'+backHTML+'</div>'+
    '</div></div>';
  flipped=false;
  const cf=document.getElementById('cardFlip');
  cf.addEventListener('click', onCardTap);
  document.getElementById('ratings').classList.remove('show');

  cardShownAt=Date.now();
  const prog=getProgress(c.id), ret=studySettings.retention;
  document.getElementById('dAgain').textContent=previewLabel(prog,ret,1);
  document.getElementById('dHard').textContent=previewLabel(prog,ret,2);
  document.getElementById('dGood').textContent=previewLabel(prog,ret,3);
  document.getElementById('dEasy').textContent=previewLabel(prog,ret,4);

  if(studySettings.autoFlip>0){
    autoFlipTimer=setTimeout(()=>{ if(!flipped) doFlip(); }, studySettings.autoFlip*1000);
  }
}
function onCardTap(){
  if(flipped && studySettings.stabilizeOnFlip) return;
  doFlip();
}
function doFlip(){
  clearTimeout(autoFlipTimer);
  flipped=!flipped;
  document.getElementById('cardFlip').classList.toggle('flipped', flipped);
  document.getElementById('ratings').classList.toggle('show', flipped);
}
document.querySelectorAll('.rate-btn').forEach(btn=>{
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    const g=parseInt(btn.dataset.g);
    const c=studyQueue[studyIdx];
    const prog=getProgress(c.id);
    const next=computeNext(prog, g, studySettings.retention);
    setProgress(c.id, {stability:next.stability, difficulty:next.difficulty, due:next.due.toISOString(), reps:next.reps, lapses:next.lapses, lastReview:new Date().toISOString()});
    logReview(c.id, c.level, g, Date.now()-cardShownAt);
    studyDone++;
    if(g===1) studyQueue.splice(studyIdx+1,0,c);
    studyIdx++;
    renderStudyCard();
  });
});

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(btn.dataset.tab==='mazos') renderMazos();
    if(btn.dataset.tab==='stats') renderStats();
    if(btn.dataset.tab==='omni') renderOmni();
  });
});

renderMazos();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
</script>
</body>
</html>
