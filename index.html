<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DeutschKarten</title>
<meta name="theme-color" content="#3B2A20">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeutschKarten">
<style>
  :root{
    --wood:#3B2A20;
    --wood-dark:#2A1D16;
    --card:#F3EAD3;
    --card-back:#EDE2C8;
    --ink:#2B2620;
    --ink-soft:#6b6153;
    --red:#B5502D;
    --ochre:#C99A3B;
    --moss:#5B7B4F;
    --teal:#3E7C7A;
    --gold-line: rgba(181,80,45,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
    background:
      radial-gradient(ellipse at top, #4a3527 0%, var(--wood) 45%, var(--wood-dark) 100%);
    color:var(--card);
    min-height:100vh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  @font-face{
    font-family:'CatalogSerif';
    src:local('Georgia');
  }
  .serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;}
  .mono{font-family:'SF Mono','Courier New',monospace; letter-spacing:0.04em;}

  header{
    padding:18px 20px 10px;
    text-align:center;
  }
  header h1{
    font-family:Georgia,serif;
    font-weight:700;
    font-size:22px;
    margin:0;
    letter-spacing:0.02em;
    color:var(--card);
  }
  header .sub{
    font-family:'SF Mono','Courier New',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#c9a876;
    margin-top:2px;
  }

  /* Drawer tabs (level selector) */
  .drawers{
    display:flex;
    gap:6px;
    padding:14px 16px 4px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .drawers::-webkit-scrollbar{display:none;}
  .drawer-tab{
    flex:0 0 auto;
    font-family:'SF Mono','Courier New',monospace;
    font-size:12px;
    letter-spacing:0.06em;
    padding:8px 14px;
    background:#4a3527;
    color:#d8c4a0;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:4px 4px 2px 2px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
    position:relative;
  }
  .drawer-tab.active{
    background:var(--card);
    color:var(--ink);
    box-shadow:0 3px 8px rgba(0,0,0,0.35);
  }
  .drawer-tab .count{
    margin-left:6px;
    opacity:0.6;
    font-size:10px;
  }

  main{
    padding:10px 20px 30px;
    max-width:480px;
    margin:0 auto;
  }

  /* Stats strip */
  .stats-strip{
    display:flex;
    justify-content:space-between;
    padding:10px 4px 18px;
    font-family:'SF Mono','Courier New',monospace;
    font-size:11px;
    color:#c9a876;
    border-bottom:1px dashed rgba(255,255,255,0.15);
    margin-bottom:20px;
  }
  .stats-strip div{text-align:center;}
  .stats-strip .num{display:block; font-size:18px; color:var(--card); font-family:Georgia,serif; font-weight:700;}

  /* Card stage */
  .stage{
    perspective:1400px;
    height:340px;
    margin-bottom:22px;
  }
  .card-flip{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.45s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    cursor:pointer;
  }
  .card-flip.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    background:var(--card);
    border-radius:6px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4), 0 2px 0 rgba(255,255,255,0.4) inset;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 24px;
    text-align:center;
  }
  .face::before{
    content:'';
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:70px; height:14px;
    background:var(--red);
    border-radius:0 0 4px 4px;
  }
  .face .holes{
    position:absolute;
    left:10px; top:16px; bottom:16px;
    width:10px;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
  }
  .face .holes span{
    width:8px; height:8px; border-radius:50%;
    background:var(--wood-dark);
    box-shadow:inset 0 1px 2px rgba(0,0,0,0.5);
  }
  .face.back{transform:rotateY(180deg); background:var(--card-back);}

  .word-type{
    font-family:'SF Mono','Courier New',monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:10px;
  }
  .german-word{
    font-family:Georgia,serif;
    font-size:32px;
    font-weight:700;
    color:var(--ink);
    line-height:1.25;
  }
  .article{color:var(--teal); font-weight:400;}
  .topic-tag{
    margin-top:14px;
    font-family:'SF Mono','Courier New',monospace;
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:0.06em;
  }
  .english-word{
    font-family:Georgia,serif;
    font-size:24px;
    color:var(--ink);
    margin-bottom:10px;
  }
  .example{
    font-size:14px;
    color:var(--ink-soft);
    font-style:italic;
    margin-top:12px;
    line-height:1.4;
  }
  .tap-hint{
    position:absolute;
    bottom:14px;
    font-family:'SF Mono','Courier New',monospace;
    font-size:9px;
    color:var(--ink-soft);
    opacity:0.6;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  /* Rating buttons */
  .ratings{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:all .25s ease;
  }
  .ratings.show{opacity:1; transform:translateY(0); pointer-events:auto;}
  .rate-btn{
    border:none;
    border-radius:6px;
    padding:14px 6px 10px;
    font-family:'SF Mono','Courier New',monospace;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:#fff;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:4px;
    align-items:center;
    transition:transform .1s ease;
  }
  .rate-btn:active{transform:scale(0.94);}
  .rate-btn .days{font-size:9px; opacity:0.75; font-weight:400;}
  .rate-btn.again{background:var(--red);}
  .rate-btn.hard{background:var(--ochre); color:#2B2620;}
  .rate-btn.good{background:var(--moss);}
  .rate-btn.easy{background:var(--teal);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:#c9a876;
  }
  .empty-state .big{
    font-family:Georgia,serif;
    font-size:20px;
    color:var(--card);
    margin-bottom:8px;
  }
  .empty-state .small{
    font-family:'SF Mono','Courier New',monospace;
    font-size:12px;
    line-height:1.6;
  }

  .progress-bar{
    height:3px;
    background:rgba(255,255,255,0.1);
    border-radius:2px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .progress-bar .fill{
    height:100%;
    background:var(--red);
    transition:width .3s ease;
  }

  footer{
    text-align:center;
    padding:16px;
    font-family:'SF Mono','Courier New',monospace;
    font-size:9px;
    color:#8a7660;
    letter-spacing:0.06em;
  }
</style>
</head>
<body>

<header>
  <h1>DeutschKarten</h1>
  <div class="sub">Karteikasten &middot; Fichero personal</div>
</header>

<div class="drawers" id="drawers"></div>

<main>
  <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
  <div class="stats-strip">
    <div><span class="num" id="statDue">0</span>Hoy</div>
    <div><span class="num" id="statDone">0</span>Hechas</div>
    <div><span class="num" id="statStreak">0</span>Racha</div>
    <div><span class="num" id="statTotal">0</span>Total</div>
  </div>

  <div id="studyArea">
    <div class="stage">
      <div class="card-flip" id="cardFlip">
        <div class="face front">
          <div class="holes"><span></span><span></span><span></span><span></span><span></span></div>
          <div class="word-type" id="typeFront">SUSTANTIVO</div>
          <div class="german-word" id="germanWord">Wort</div>
          <div class="topic-tag" id="topicFront"></div>
          <div class="tap-hint">Toca para voltear</div>
        </div>
        <div class="face back">
          <div class="holes"><span></span><span></span><span></span><span></span><span></span></div>
          <div class="word-type" id="typeBack">TRADUCCIÓN</div>
          <div class="english-word" id="englishWord">word</div>
          <div class="example" id="exampleText"></div>
        </div>
      </div>
    </div>

    <div class="ratings" id="ratings">
      <button class="rate-btn again" data-q="0">Otra vez<span class="days" id="dAgain">&lt;1d</span></button>
      <button class="rate-btn hard" data-q="1">Difícil<span class="days" id="dHard">1d</span></button>
      <button class="rate-btn good" data-q="2">Bien<span class="days" id="dGood">3d</span></button>
      <button class="rate-btn easy" data-q="3">Fácil<span class="days" id="dEasy">6d</span></button>
    </div>
  </div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="big">Fichero al día</div>
    <div class="small">No hay tarjetas pendientes en este nivel.<br>Vuelve más tarde o cambia de cajón.</div>
  </div>
</main>

<footer>SM-2 &middot; almacenamiento local &middot; sin conexión</footer>

<script src="cards-data.js"></script>
<script>
/* ---------- Storage ---------- */
const PROGRESS_KEY = 'dk_progress_v1';
const STATS_KEY = 'dk_stats_v1';

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }

function loadStats(){
  try{ return JSON.parse(localStorage.getItem(STATS_KEY)) || {lastStudyDate:null, streak:0, doneToday:0, doneDate:null}; }
  catch(e){ return {lastStudyDate:null, streak:0, doneToday:0, doneDate:null}; }
}
function saveStats(s){ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }

function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ---------- SM-2 ---------- */
function schedule(entry, quality){
  // quality: 0 again, 1 hard, 2 good, 3 easy  -> mapped to SM2 scale
  let {ef=2.5, interval=0, reps=0} = entry || {};
  const qMap = [1, 3, 4, 5][quality];
  if(qMap < 3){
    reps = 0;
    interval = quality === 0 ? 0 : 1; // "again" due immediately, "hard" ~1 day handled below
  } else {
    if(reps === 0) interval = 1;
    else if(reps === 1) interval = 6;
    else interval = Math.round(interval * ef);
    reps += 1;
  }
  ef = Math.max(1.3, ef + (0.1 - (5-qMap)*(0.08+(5-qMap)*0.02)));
  if(quality === 1) interval = Math.max(1, Math.round(interval*0.5)) || 1;
  if(quality === 0) interval = 0;

  const due = new Date();
  if(interval === 0){ due.setMinutes(due.getMinutes()+10); }
  else { due.setDate(due.getDate() + interval); }

  return {ef, interval, reps, due: due.toISOString()};
}

function previewIntervals(entry){
  const opts = [0,1,2,3].map(q => schedule(entry, q));
  const fmt = (r,q) => {
    if(q===0) return '<1d';
    const d = r.interval;
    return d < 1 ? '<1d' : d+'d';
  };
  return {
    again: fmt(opts[0],0), hard: fmt(opts[1],1), good: fmt(opts[2],2), easy: fmt(opts[3],3)
  };
}

/* ---------- App state ---------- */
let progress = loadProgress();
let stats = loadStats();
let currentLevel = 'all';
let queue = [];
let currentCard = null;
let flipped = false;

const LEVELS = [
  {id:'all', label:'📚 Todo'},
  {id:'A1', label:'🟢 A1'},
  {id:'A2', label:'🟡 A2'},
  {id:'B1.1', label:'🔵 B1.1'},
  {id:'B1.2', label:'🩵 B1.2'},
];

function levelCards(levelId){
  if(levelId === 'all') return CARDS;
  return CARDS.filter(c => c.level === levelId);
}

function isDue(card){
  const p = progress[card.id];
  if(!p) return true;
  return new Date(p.due) <= new Date();
}

function buildQueue(){
  const pool = levelCards(currentLevel);
  queue = pool.filter(isDue).sort((a,b)=>{
    const da = progress[a.id] ? new Date(progress[a.id].due) : new Date(0);
    const db = progress[b.id] ? new Date(progress[b.id].due) : new Date(0);
    return da - db;
  });
}

function renderDrawers(){
  const el = document.getElementById('drawers');
  el.innerHTML = '';
  LEVELS.forEach(lv=>{
    const due = levelCards(lv.id).filter(isDue).length;
    const btn = document.createElement('div');
    btn.className = 'drawer-tab' + (lv.id===currentLevel ? ' active':'');
    btn.innerHTML = lv.label + (due>0 ? `<span class="count">${due}</span>` : '');
    btn.onclick = ()=>{ currentLevel = lv.id; buildQueue(); renderDrawers(); nextCard(); renderStats(); };
    el.appendChild(btn);
  });
}

function renderStats(){
  const today = todayStr();
  if(stats.doneDate !== today){ stats.doneToday = 0; }
  document.getElementById('statDue').textContent = queue.length;
  document.getElementById('statDone').textContent = stats.doneToday;
  document.getElementById('statStreak').textContent = stats.streak;
  document.getElementById('statTotal').textContent = levelCards(currentLevel).length;

  const totalPool = levelCards(currentLevel).length;
  const donePct = totalPool ? Math.min(100, Math.round((stats.doneToday / Math.max(1, levelCards(currentLevel).filter(isDue).length + stats.doneToday)) * 100)) : 0;
  document.getElementById('progressFill').style.width = donePct + '%';
}

function wordTypeLabel(c){
  const map = {noun:'Sustantivo', verb:'Verbo', adjective:'Adjetivo', adverb:'Adverbio', preposition:'Preposición', phrase:'Frase', other:'Otro'};
  return (map[c.wordType] || c.wordType || '').toUpperCase();
}

function renderCard(){
  const stage = document.getElementById('studyArea');
  const empty = document.getElementById('emptyState');
  if(!currentCard){
    stage.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  stage.style.display = 'block';
  empty.style.display = 'none';

  const c = currentCard;
  const article = c.gender === 'der' ? 'der ' : c.gender === 'die' ? 'die ' : c.gender === 'das' ? 'das ' : '';
  document.getElementById('typeFront').textContent = wordTypeLabel(c);
  document.getElementById('germanWord').innerHTML = article ? `<span class="article">${article}</span>${c.german}` : c.german;
  document.getElementById('topicFront').textContent = c.topic || '';
  document.getElementById('typeBack').textContent = wordTypeLabel(c);
  document.getElementById('englishWord').textContent = c.english;
  document.getElementById('exampleText').textContent = c.example || '';

  const prev = previewIntervals(progress[c.id]);
  document.getElementById('dAgain').textContent = prev.again;
  document.getElementById('dHard').textContent = prev.hard;
  document.getElementById('dGood').textContent = prev.good;
  document.getElementById('dEasy').textContent = prev.easy;

  flipped = false;
  document.getElementById('cardFlip').classList.remove('flipped');
  document.getElementById('ratings').classList.remove('show');
}

function nextCard(){
  currentCard = queue.length ? queue[0] : null;
  renderCard();
}

function flipCard(){
  if(!currentCard) return;
  flipped = !flipped;
  document.getElementById('cardFlip').classList.toggle('flipped', flipped);
  document.getElementById('ratings').classList.toggle('show', flipped);
}

function rate(quality){
  if(!currentCard) return;
  const entry = progress[currentCard.id];
  const updated = schedule(entry, quality);
  progress[currentCard.id] = updated;
  saveProgress(progress);

  const today = todayStr();
  if(stats.doneDate !== today){
    stats.streak = stats.lastStudyDate === yesterday(today) ? stats.streak + 1 : 1;
    stats.doneToday = 0;
    stats.doneDate = today;
    stats.lastStudyDate = today;
  }
  stats.doneToday += 1;
  stats.lastStudyDate = today;
  saveStats(stats);

  queue.shift();
  if(updated.interval === 0){
    // re-insert a few cards later for "again"
    queue.splice(Math.min(queue.length,3), 0, currentCard);
  }
  nextCard();
  renderStats();
  renderDrawers();
}

function yesterday(dateStr){
  const d = new Date(dateStr);
  d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}

document.getElementById('cardFlip').addEventListener('click', flipCard);
document.querySelectorAll('.rate-btn').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    rate(parseInt(btn.dataset.q));
  });
});

/* ---------- Init ---------- */
buildQueue();
renderDrawers();
nextCard();
renderStats();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
